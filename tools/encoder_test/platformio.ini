; Standalone encoder bench test. Uses only the ESP-IDF PCNT driver, so it builds
; without gflib. Pins are copied from include/pod_config.hpp.
;
;   pio run -d tools/encoder_test -t upload -t monitor

[env:encoder_test]
platform  = espressif32@6.13.0
board     = esp32-s3-devkitc-1
framework = espidf

monitor_speed = 115200
